name: 'API Release'

permissions:
  contents: read

on:
  push:
    branches:
      - main

concurrency:
  group: api-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 'Verify Application'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: 'Installing PNPM'
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024
        with:
          version: 12.6.0
          runtime: node@26.10.0
          cache: true
          require-lockfile: true

      - name: 'Lint'
        run: 'pnpm lint'

      - name: 'Unit Tests'
        run: 'pnpm test'

      - name: 'E2E Tests'
        run: 'pnpm test:e2e'

  package:
    name: 'Build Docker Image'
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: 'Checkout Code'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: 'Project Version'
        id: version
        run: echo "value=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: 'Login to Docker Hub'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 'Set up QEMU'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1

      - name: 'Set up Buildx'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: 'Build Multi-Platform Image'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/portfolio-api:latest
            ${{ vars.DOCKERHUB_USERNAME }}/portfolio-api:${{ steps.version.outputs.value }}
            ${{ vars.DOCKERHUB_USERNAME }}/portfolio-api:sha-${{ github.sha }}

  deploy:
    name: 'Application Deployment'
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: 'Connecting to Local Network'
        uses: twingate/github-action@358e205bb31e636fef1dfb706228ab60eb90c181
        with:
          service-key: ${{ secrets.LOCAL_NETWORK }}

      - name: 'Deploy Application'
        uses: steebchen/kubectl@7c4c70d551952e40881998b840e16d4d9824a54f
        with:
          config: ${{ secrets.KUBE_CONFIG }}
          command: set image deployment/api api=${{ vars.DOCKERHUB_USERNAME }}/portfolio-api@${{ needs.package.outputs.digest }} -n portfolio

      - name: 'Verify Deployment'
        uses: steebchen/kubectl@7c4c70d551952e40881998b840e16d4d9824a54f
        with:
          config: ${{ secrets.KUBE_CONFIG }}
          command: rollout status deployment/api -n portfolio
